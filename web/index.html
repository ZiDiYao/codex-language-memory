<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sayrove</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header>
        <div class="topline">
          <div class="app-heading">
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                d="M4 4h6c2 0 2 1 2 2v15c0-2-1-3-3-3H4zM20 4h-6c-2 0-2 1-2 2v15c0-2 1-3 3-3h5z"
              />
            </svg>
            <h1 data-i18n="appTitle">Sayrove</h1>
          </div>
          <div class="header-actions">
            <!-- local-account:start -->
            <!-- profile-shared:start -->
            <button id="local-profile-open" type="button" class="icon-button profile-trigger" aria-haspopup="dialog" aria-controls="local-profile-dialog" aria-expanded="false" data-tooltip="accountProfile" title="Profile">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="7.1" r="3.4"/><path d="M3.8 21.1v-1.6a8.2 6.3 0 0 1 16.4 0v1.6"/></svg>
              <span class="sr-only" data-i18n="accountProfile">Profile</span>
            </button>
            <dialog id="local-profile-dialog" class="profile-dialog" aria-labelledby="local-profile-title">
              <div class="dialog-heading">
                <h2 id="local-profile-title" data-i18n="accountProfile">Profile</h2>
                <button id="local-profile-close" type="button" class="sr-only-focusable" data-i18n="close">Close</button>
              </div>
              <div class="dialog-body">
              <section class="profile-account profile-section" aria-labelledby="local-profile-account-title">
                <h3 id="local-profile-account-title" data-i18n="profileAccount">Account</h3>
                <div class="profile-account-row">
                  <div class="profile-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="3.2"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></div>
                  <div class="profile-account-summary">
                    <p id="local-profile-name" class="profile-name" hidden></p>
                    <p id="local-profile-email" class="profile-email" hidden></p>
                    <p id="local-profile-status" class="profile-account-state" role="status"></p>
                  </div>
                </div>
                <!-- desktop-auth:start -->
                <div class="profile-auth-actions">
                  <button id="local-profile-connect" type="button" data-account-action data-i18n="accountLogin" hidden>Sign in</button>
                  <button id="local-profile-authorize" type="button" class="subtle" data-account-action data-i18n="accountContinue" hidden>Continue in browser</button>
                </div>
                <p id="local-profile-help" class="help" hidden></p>
                <p id="local-profile-feedback" class="profile-feedback help error" role="status" hidden></p>
                <!-- desktop-auth:end -->
              </section>
              <section class="profile-activity profile-section" data-activity-view aria-labelledby="local-profile-activity-title">
                <div class="profile-section-heading">
                  <h3 id="local-profile-activity-title" data-i18n="profileActivity">Learning activity</h3>
                  <button type="button" class="activity-refresh subtle" data-activity-action="refresh" data-i18n="activityRefresh">Refresh</button>
                </div>
                <p class="activity-range" data-activity-range hidden></p>
                <p class="help activity-status" data-activity-status role="status" aria-live="polite" data-i18n="activityLoading">Loading activity…</p>
                <button type="button" class="activity-retry subtle" data-activity-action="retry" data-i18n="activityRetry" hidden>Try again</button>
                <div class="activity-calendar" data-activity-calendar hidden>
                  <div class="profile-heatmap" data-activity-grid role="group" aria-labelledby="local-profile-activity-title" aria-describedby="local-profile-activity-detail local-profile-activity-help"></div>
                  <div class="activity-legend" aria-hidden="true"><span data-i18n="activityLess">Less</span><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><span data-i18n="activityMore">More</span></div>
                  <p id="local-profile-activity-detail" class="activity-detail" data-activity-detail role="status" aria-live="polite" data-i18n="activitySelectDay">Point to a day or use the arrow keys for details.</p>
                  <p class="help activity-summary" data-activity-summary></p>
                </div>
                <p id="local-profile-activity-help" class="help activity-help" data-activity-help data-i18n="activityWeights">Words &amp; phrases 70% · app activity 30%</p>
              </section>
              </div>
              <footer id="local-profile-footer" class="cloud-profile-footer profile-footer" hidden>
                <button id="local-profile-disconnect" type="button" class="subtle cloud-profile-logout" data-account-action data-i18n="accountLogout" hidden>Sign out</button>
              </footer>
            </dialog>
            <!-- profile-shared:end -->
            <!-- local-account:end -->
            <button id="export-open" type="button" class="icon-button" aria-haspopup="dialog" data-tooltip="export">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12m-4-4 4 4 4-4M4 15v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5" />
              </svg>
              <span class="sr-only" data-i18n="export">Export</span>
            </button>
            <button
              id="settings-open"
              type="button"
              class="icon-button"
              aria-haspopup="dialog"
              data-tooltip="settings"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              >
                <path
                  d="m9 3-.6 2.5-2.1 1.2L4 6l-2 3.5 1.7 1.8v2.4L2 15.5 4 19l2.3-.7 2.1 1.2L9 22h4l.6-2.5 2.1-1.2 2.3.7 2-3.5-1.7-1.8v-2.4L20 9.5 18 6l-2.3.7-2.1-1.2L13 3z"
                />
                <circle cx="11" cy="12.5" r="3" />
              </svg>
              <span class="sr-only" data-i18n="settings">Settings</span>
            </button>
          </div>
        </div>
        <div class="intro-row">
          <p data-i18n="subtitle"></p>
          <span
            id="recording-badge"
            class="badge"
            data-i18n="connecting"
          ></span>
        </div>
      </header>
      <!-- local-account:start -->
      <aside id="local-account-notice" class="local-account-notice help" role="status" hidden></aside>
      <!-- local-account:end -->
      <section id="records-panel">
        <div class="history-filters">
          <nav id="kinds" class="type-tabs" aria-label="Type"></nav>
          <div class="history-selectors">
            <div id="language" class="history-language"></div>
            <div id="scene" class="history-scene"></div>
            <div id="status" class="history-status" hidden></div>
          </div>
        </div>
        <form id="search-form" class="search-line" role="search">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <label class="sr-only" for="search" data-i18n="search"></label>
          <input
            id="search"
            type="text"
            role="searchbox"
            enterkeyhint="search"
            maxlength="350"
            data-placeholder="searchPlaceholder"
          />
          <button id="search-clear" type="button" class="search-clear" data-tooltip="clearSearch" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17" /></svg>
            <span class="sr-only" data-i18n="clearSearch">Clear search</span>
          </button>
        </form>
        <div id="records" aria-live="polite"></div>
        <div id="load-sentinel">
          <span id="load-state" data-i18n="loading"></span
          ><button id="retry-load" hidden data-i18n="retry"></button>
        </div>
      </section>
    </main>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="dialog-heading">
        <h2 id="settings-title" data-i18n="settingsTitle"></h2>
        <button type="button" class="dialog-close sr-only-focusable" data-i18n="close">Close</button>
      </div>
      <div class="dialog-body">
      <p class="help" data-i18n="settingsHelp"></p>
      <div class="setting">
        <span class="field-label" data-i18n="uiLanguage"></span>
        <div id="ui-language"></div>
      </div>
      <fieldset id="settings-fields" disabled>
        <div class="setting">
          <span class="field-label" data-i18n="firstLanguage"></span>
          <div id="first-language"></div>
          <p class="help" data-i18n="firstLanguageHelp"></p>
        </div>
        <div class="setting">
          <span class="field-label" data-i18n="explanationLanguage"></span>
          <div id="explanation-language"></div>
          <p class="help" data-i18n="explanationLanguageHelp"></p>
        </div>
        <label class="toggle-row"
          ><span
            ><strong data-i18n="recording"></strong
            ><small data-i18n="recordingHelp"></small></span
          ><input id="enabled" type="checkbox" role="switch"
        /></label>
        <div class="setting">
          <h3 data-i18n="recordTypes"></h3>
          <p class="help" data-i18n="recordTypesHelp"></p>
          <div class="type-grid">
            <label class="choice">
              <input type="checkbox" name="enabled-type" value="word" checked
                aria-labelledby="capture-word-title" aria-describedby="capture-word-help"/>
              <strong id="capture-word-title" data-i18n="word"></strong>
              <small id="capture-word-help"><span data-i18n="wordHelp"></span><span data-i18n="wordHelpDetail"></span></small>
            </label>
            <label class="choice">
              <input type="checkbox" name="enabled-type" value="expression" checked
                aria-labelledby="capture-expression-title" aria-describedby="capture-expression-help"/>
              <strong id="capture-expression-title" data-i18n="expression"></strong>
              <small id="capture-expression-help"><span data-i18n="expressionHelp"></span><span data-i18n="expressionHelpDetail"></span></small>
            </label>
            <label class="choice">
              <input type="checkbox" name="enabled-type" value="grammar" checked
                aria-labelledby="capture-grammar-title" aria-describedby="capture-grammar-help"/>
              <strong id="capture-grammar-title" data-i18n="grammar"></strong>
              <small id="capture-grammar-help"><span data-i18n="grammarHelp"></span><span data-i18n="grammarHelpDetail"></span></small>
            </label>
            <label class="choice">
              <input type="checkbox" name="enabled-type" value="correction" checked
                aria-labelledby="capture-correction-title" aria-describedby="capture-correction-help"/>
              <strong id="capture-correction-title" data-i18n="correction"></strong>
              <small id="capture-correction-help"><span data-i18n="correctionHelp"></span><span data-i18n="correctionHelpDetail"></span></small>
            </label>
          </div>
        </div>
      </fieldset>
      <p class="help" data-i18n="limitsHelp"></p>
      <div class="settings-feedback help" role="status"></div>
      </div>
    </dialog>
    <dialog id="export-dialog" aria-labelledby="export-title">
      <div class="dialog-heading">
        <h2 id="export-title" data-i18n="export"></h2>
        <button type="button" class="dialog-close sr-only-focusable" data-i18n="close">Close</button>
      </div>
      <form id="export-filters">
        <div id="export-history" class="export-history" role="status"><span id="export-history-title"></span><small id="export-history-detail"></small></div>
        <div class="export-grid">
          <div><span class="field-label" data-i18n="notebook"></span><div id="export-language"></div></div>
          <div><span class="field-label" data-i18n="status"></span><div id="export-status"></div></div>
        </div>
        <span class="field-label" data-i18n="scene"></span>
        <div id="export-scene"></div>
        <span class="field-label" data-i18n="kind"></span>
        <div id="export-kinds" class="type-tabs"></div>
        <div class="export-date-range"><span class="field-label" data-i18n="exportRangeLabel"></span><div id="export-range"></div></div>
        <button id="export-next" class="export-next" type="submit" data-i18n="exportChooseFormat"></button>
      </form>
      <section id="export-formats" hidden>
      <button id="export-back" type="button" class="subtle" data-i18n="exportBack"></button>
      <h3 id="export-selection-title" tabindex="-1"></h3>
      <p id="export-selection-range" class="help"></p>
      <p id="export-selection-preview" class="help"></p>
      <div class="export-options">
        <button data-format="pdf">PDF <span>.pdf</span></button>
        <button data-format="xlsx">Excel <span>.xlsx</span></button>
        <button data-format="docx">Word <span>.docx</span></button>
        <button data-format="notion">
          <span data-i18n="notionImport"></span><span>.zip</span>
        </button>
        <button data-format="json">JSON <span>.json</span></button>
      </div>
      <p class="help" data-i18n="notionHelp"></p>
      </section>
      <div class="export-feedback help" role="status"></div>
    </dialog>
    <div id="notice" role="status" hidden></div>
  </body>
</html>
