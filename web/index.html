<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Language memory</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header>
        <div class="topline">
          <div class="app-heading">
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                d="M4 4h6c2 0 2 1 2 2v15c0-2-1-3-3-3H4zM20 4h-6c-2 0-2 1-2 2v15c0-2 1-3 3-3h5z"
              />
            </svg>
            <h1 data-i18n="appTitle">Language memory</h1>
          </div>
          <div class="header-actions">
            <button id="export-open" class="subtle" data-i18n="export">
              Export
            </button>
            <button
              id="settings-open"
              class="icon-button"
              aria-haspopup="dialog"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              >
                <path
                  d="m9 3-.6 2.5-2.1 1.2L4 6l-2 3.5 1.7 1.8v2.4L2 15.5 4 19l2.3-.7 2.1 1.2L9 22h4l.6-2.5 2.1-1.2 2.3.7 2-3.5-1.7-1.8v-2.4L20 9.5 18 6l-2.3.7-2.1-1.2L13 3z"
                />
                <circle cx="11" cy="12.5" r="3" />
              </svg>
              <span class="sr-only" data-i18n="settings">Settings</span>
            </button>
          </div>
        </div>
        <div class="intro-row">
          <p data-i18n="subtitle"></p>
          <span
            id="recording-badge"
            class="badge"
            data-i18n="connecting"
          ></span>
        </div>
      </header>
      <section id="records-panel">
        <div id="page-heading" class="page-heading" hidden>
          <button id="back-library" class="subtle" data-i18n="backLibrary"></button>
          <button id="page-ask" class="subtle" data-i18n="askCodex"></button>
        </div>
        <h2 id="page-title" class="collection-title" tabindex="-1" hidden></h2>
        <div id="browse-controls">
        <form id="search-form" class="search-line" role="search">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <label class="sr-only" for="search" data-i18n="search"></label>
          <input
            id="search"
            type="search"
            maxlength="350"
            data-placeholder="searchPlaceholder"
          />
        </form>
        <div class="filters">
          <div id="language-field" hidden>
            <span class="field-label" data-i18n="notebook"></span>
            <div id="language"></div>
          </div>
          <div>
            <span class="field-label" data-i18n="status"></span>
            <div id="status"></div>
          </div>
        </div>
        </div>
        <nav id="collections" class="collections" aria-label="Knowledge pages"></nav>
        <div id="records" aria-live="polite"></div>
        <div id="load-sentinel">
          <span id="load-state" data-i18n="loading"></span
          ><button id="retry-load" hidden data-i18n="retry"></button>
        </div>
      </section>
    </main>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="dialog-heading">
        <h2 id="settings-title" data-i18n="settingsTitle"></h2>
        <button class="icon-button dialog-close">
          <span aria-hidden="true">×</span
          ><span class="sr-only" data-i18n="close"></span>
        </button>
      </div>
      <p class="help" data-i18n="settingsHelp"></p>
      <div class="setting">
        <span class="field-label" data-i18n="uiLanguage"></span>
        <div id="ui-language"></div>
      </div>
      <fieldset id="settings-fields" disabled>
        <div class="setting">
          <span class="field-label" data-i18n="firstLanguage"></span>
          <div id="first-language"></div>
          <p class="help" data-i18n="firstLanguageHelp"></p>
        </div>
        <div class="setting">
          <span class="field-label" data-i18n="explanationLanguage"></span>
          <div id="explanation-language"></div>
          <p class="help" data-i18n="explanationLanguageHelp"></p>
        </div>
        <label class="toggle-row"
          ><span
            ><strong data-i18n="recording"></strong
            ><small data-i18n="recordingHelp"></small></span
          ><input id="enabled" type="checkbox" role="switch"
        /></label>
        <div class="setting">
          <h3 data-i18n="recordTypes"></h3>
          <div class="type-grid">
            <label class="choice"
              ><input
                type="checkbox"
                name="enabled-type"
                value="word"
                checked /><span
                ><strong data-i18n="word"></strong
                ><small data-i18n="wordHelp"></small></span
            ></label>
            <label class="choice"
              ><input
                type="checkbox"
                name="enabled-type"
                value="expression"
                checked /><span
                ><strong data-i18n="expression"></strong
                ><small data-i18n="expressionHelp"></small></span
            ></label>
            <label class="choice"
              ><input
                type="checkbox"
                name="enabled-type"
                value="grammar"
                checked /><span
                ><strong data-i18n="grammar"></strong
                ><small data-i18n="grammarHelp"></small></span
            ></label>
            <label class="choice"
              ><input
                type="checkbox"
                name="enabled-type"
                value="correction"
                checked /><span
                ><strong data-i18n="correction"></strong
                ><small data-i18n="correctionHelp"></small></span
            ></label>
          </div>
        </div>
      </fieldset>
      <p class="help" data-i18n="limitsHelp"></p>
      <div class="settings-feedback help" role="status"></div>
    </dialog>
    <dialog id="export-dialog" aria-labelledby="export-title">
      <div class="dialog-heading">
        <h2 id="export-title" data-i18n="export"></h2>
        <button class="icon-button dialog-close">
          <span aria-hidden="true">×</span
          ><span class="sr-only" data-i18n="close"></span>
        </button>
      </div>
      <p class="help" data-i18n="exportHelp"></p>
      <div class="export-options">
        <button data-format="pdf">PDF <span>.pdf</span></button>
        <button data-format="xlsx">Excel <span>.xlsx</span></button>
        <button data-format="docx">Word <span>.docx</span></button>
        <button data-format="notion">
          <span data-i18n="notionImport"></span><span>.zip</span>
        </button>
        <button data-format="json">JSON <span>.json</span></button>
      </div>
      <p class="help" data-i18n="notionHelp"></p>
      <div class="export-feedback help" role="status"></div>
    </dialog>
    <dialog id="codex-dialog" aria-labelledby="codex-title">
      <div class="dialog-heading">
        <h2 id="codex-title" data-i18n="askCodex"></h2>
        <button class="icon-button dialog-close"><span aria-hidden="true">×</span><span class="sr-only" data-i18n="close"></span></button>
      </div>
      <p class="help" data-i18n="codexHelp"></p>
      <label class="question-label"><span class="field-label" data-i18n="yourQuestion"></span>
        <textarea id="codex-question" rows="3" maxlength="500" data-placeholder="questionPlaceholder"></textarea>
      </label>
      <div class="actions">
        <a id="codex-open" class="button-link" data-i18n="continueCodex"></a>
        <button id="codex-copy" class="subtle" data-i18n="copyPrompt"></button>
      </div>
      <p id="codex-feedback" class="help" role="status"></p>
      <label id="prompt-fallback" hidden><span class="field-label" data-i18n="copyPrompt"></span><textarea id="codex-prompt" rows="5" readonly></textarea></label>
    </dialog>
    <div id="notice" role="status" hidden></div>
  </body>
</html>
