name: Node backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: language_memory
          POSTGRES_PASSWORD: node_ci_only
          POSTGRES_DB: node_backend_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U language_memory -d node_backend_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://language_memory:node_ci_only@127.0.0.1:5432/node_backend_tests
      PYTHON_EXECUTABLE: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: npm ci --ignore-scripts
        working-directory: backend-node
      - run: python -m pip install -r requirements-cloud-dev.txt
      - name: Test Node backend and compatibility with the retained Python service
        run: npm test
        working-directory: backend-node
      - name: Build independent Node runtime
        run: docker build -f backend-node/Dockerfile -t language-memory-cloud-node:ci backend-node
      - run: git diff --check
